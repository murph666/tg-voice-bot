name: CMake on Linux
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-19 clang-tidy libssl-dev

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: .cpm_cache
          key: cpm-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: |
            cpm-

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ github.ref }}
          restore-keys: ${{ runner.os }}-
          max-size: 2G

      - name: Configure CMake
        run: |
          cmake --preset debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \

      - name: Build
        run: cmake --build --preset debug

      - name: Run tests
        run: ctest --test-dir build/debug --output-on-failure

      - name: Format check
        run: cmake --build --preset debug --target format-check

      - name: Lint
        run: cmake --build --preset debug --target lint
